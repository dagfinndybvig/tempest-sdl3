<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Tempest SDL3</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: 'Lucida Console', Monaco, monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas.emscripten {
        display: block;
        background: #000;
        outline: none;
        border: 0;
        padding: 0;
        margin: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
        max-width: 100vw;
        max-height: 100vh;
      }
      #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #888;
        font-size: 14px;
        pointer-events: none;
      }
      #status.hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <div id="status">Loading...</div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var canvasElement = document.getElementById('canvas');

      canvasElement.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        statusElement.textContent = 'WebGL context lost — reload to continue.';
        statusElement.classList.remove('hidden');
      }, false);

      // Prevent default touch behaviours that would steal swipes.
      ['touchstart','touchmove','touchend','touchcancel','gesturestart','gesturechange','gestureend'].forEach(t => {
        canvasElement.addEventListener(t, e => e.preventDefault(), { passive: false });
      });

      function sizeCanvas() {
        // Match drawing-buffer to CSS pixel size of the viewport (square clipped to min dim).
        var dpr = window.devicePixelRatio || 1;
        var side = Math.min(window.innerWidth, window.innerHeight);
        canvasElement.style.width = side + 'px';
        canvasElement.style.height = side + 'px';
        canvasElement.width = Math.floor(side * dpr);
        canvasElement.height = Math.floor(side * dpr);
      }
      window.addEventListener('resize', sizeCanvas);
      window.addEventListener('orientationchange', sizeCanvas);
      sizeCanvas();

      // Focus canvas on first interaction so keyboard works on desktop.
      var focusOnce = () => { canvasElement.focus(); };
      canvasElement.addEventListener('pointerdown', focusOnce, { once: false });

      var Module = {
        canvas: canvasElement,
        print: (...args) => console.log(...args),
        printErr: (...args) => console.warn(...args),
        setStatus: (text) => {
          if (!text) { statusElement.classList.add('hidden'); return; }
          statusElement.classList.remove('hidden');
          statusElement.textContent = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Loading… (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
        }
      };
      Module.setStatus('Loading...');
      window.onerror = () => {
        Module.setStatus('Error — see console.');
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
